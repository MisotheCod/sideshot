name: Sideshot
options:
  bundleIdPrefix: com.cam
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  debug:
    SWIFT_OPTIMIZATION_LEVEL: Onone
    DEBUG_INFORMATION_FORMAT: dwarf
  release:
    SWIFT_OPTIMIZATION_LEVEL: O
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Sideshot:
    type: application
    platform: macOS
    productName: Sideshot
    bundleId: com.cam.sideshot
    sources:
      - path: Sideshot
    entitlements:
      path: Sideshot/Sideshot.entitlements
      properties:
        # Sparkle.framework is ad-hoc signed (no Developer ID); Hardened Runtime's
        # library validation otherwise refuses to load it. Safe for a non-sandboxed
        # local app. Remove once releases are signed with a Developer ID.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sideshot/Sideshot.entitlements
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        PRODUCT_BUNDLE_IDENTIFIER: com.cam.sideshot
    info:
      path: Sideshot/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Cam"
        CFBundleShortVersionString: "0.1.9"
        CFBundleVersion: "9"
        SUFeedURL: "https://github.com/MisotheCod/sideshot/releases/latest/download/appcast.xml"
        SUPublicEDKey: "dkk/tUXiZES0c6Zn1MavgX8mUjkITrfw2Ig3jeLvTXI="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    dependencies:
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      # Xcode does not emit a legacy AppIcon.icns for this target, so a stale
      # 256px-max file was being shipped (and copied forward every build). Any
      # consumer reading the .icns — Finder, legacy NSImage paths — got a soft,
      # mismatched icon. Rebuild a full 16→1024 .icns from the asset catalog.
      - name: Generate full-size AppIcon.icns
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/Sideshot/Assets.xcassets/AppIcon.appiconset"
          OUT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
          TMPDIR_ICNS="$(mktemp -d)/AppIcon.iconset"
          mkdir -p "${TMPDIR_ICNS}"
          cp "${SRC}"/icon_16x16.png "${SRC}"/icon_16x16@2x.png \
             "${SRC}"/icon_32x32.png "${SRC}"/icon_32x32@2x.png \
             "${SRC}"/icon_128x128.png "${SRC}"/icon_128x128@2x.png \
             "${SRC}"/icon_256x256.png "${SRC}"/icon_256x256@2x.png \
             "${SRC}"/icon_512x512.png "${SRC}"/icon_512x512@2x.png \
             "${TMPDIR_ICNS}/"
          iconutil -c icns "${TMPDIR_ICNS}" -o "${OUT}"
          echo "AppIcon.icns regenerated: $(ls -l "${OUT}" | awk '{print $5}') bytes"

schemes:
  Sideshot:
    build:
      targets:
        Sideshot: all
    run:
      config: Debug
    archive:
      config: Release

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1