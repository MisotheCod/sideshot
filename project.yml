name: Sideshot
options:
  bundleIdPrefix: com.cam
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  debug:
    SWIFT_OPTIMIZATION_LEVEL: Onone
    DEBUG_INFORMATION_FORMAT: dwarf
  release:
    SWIFT_OPTIMIZATION_LEVEL: O
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Sideshot:
    type: application
    platform: macOS
    productName: Sideshot
    bundleId: com.cam.sideshot
    sources:
      - path: Sideshot
    entitlements:
      path: Sideshot/Sideshot.entitlements
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Sideshot/Sideshot.entitlements
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        PRODUCT_BUNDLE_IDENTIFIER: com.cam.sideshot
    info:
      path: Sideshot/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Cam"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"

schemes:
  Sideshot:
    build:
      targets:
        Sideshot: all
    run:
      config: Debug
    archive:
      config: Release

packages: {}